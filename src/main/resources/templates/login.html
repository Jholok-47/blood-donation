<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Blood Donation Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:400px;">
    <h2 class="mb-4">Login</h2>

    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created — please log in</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
