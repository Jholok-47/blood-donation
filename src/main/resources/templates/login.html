<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log In — LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3 text-center">Log in to LifeLink</h3>

            <div th:if="${param.registered}" class="alert alert-success">Registration successful — please log in.</div>
            <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Log In</button>
            </form>

            <hr>
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-dark w-100">
                Sign in with Google
            </a>

            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/register}">Create an account</a>
                <!-- Module 14: forgot-password route not built yet -->
                <a th:href="@{/forgot-password}" class="text-muted">Forgot password?</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
