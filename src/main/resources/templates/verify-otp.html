<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Email — LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-2 text-center">Verify your email</h3>
            <p class="text-muted text-center small">
                We sent a 6-digit code to <strong th:text="${otpVerifyRequest.email}"></strong>
            </p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${otpError}" class="alert alert-danger" th:text="${otpError}"></div>

            <form th:action="@{/verify-otp}" th:object="${otpVerifyRequest}" method="post">
                <input type="hidden" th:field="*{email}">
                <div class="mb-3">
                    <label class="form-label">Verification Code</label>
                    <input type="text" class="form-control" maxlength="6" th:field="*{otpCode}" autofocus>
                    <div class="text-danger small" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                </div>
                <button type="submit" class="btn btn-danger w-100">Verify</button>
            </form>

            <form th:action="@{/resend-otp}" method="post" class="mt-3 text-center">
                <input type="hidden" name="email" th:value="${otpVerifyRequest.email}">
                <button type="submit" class="btn btn-link p-0">Resend code</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
