<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Complete Your Profile — LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 640px; margin-top: 40px; margin-bottom: 40px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-1">Complete your profile</h3>
            <p class="text-muted">One last step before you can use LifeLink.</p>

            <div th:if="${profileError}" class="alert alert-danger" th:text="${profileError}"></div>

            <form th:action="@{/complete-profile}" th:object="${profileCompletionDto}" method="post">

                <div class="mb-3">
                    <label class="form-label">I am a</label>
                    <select class="form-select" th:field="*{role}" id="roleSelect" onchange="toggleDonorFields()">
                        <option value="">-- Select --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Blood Group</label>
                    <select class="form-select" th:field="*{bloodGroup}">
                        <option value="">-- Select --</option>
                        <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">District</label>
                    <input type="text" class="form-control" th:field="*{district}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="mb-3" id="lastDonationDateGroup" style="display:none;">
                    <label class="form-label">Last Donation Date (optional)</label>
                    <input type="date" class="form-control" th:field="*{lastDonationDate}">
                    <small class="text-muted">Leave blank if you've never donated, or don't remember.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Location</label>
                    <div th:replace="~{fragments/map-picker :: mapPicker('latitude', 'longitude', ${defaultLat}, ${defaultLng}, ${defaultZoom})}"></div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></div>
                </div>

                <button type="submit" class="btn btn-danger w-100">Finish Setup</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/maps-loader :: mapsLoader(${mapsApiKey})}"></div>

<script>
    function toggleDonorFields() {
        const role = document.getElementById('roleSelect').value;
        document.getElementById('lastDonationDateGroup').style.display = (role === 'DONOR') ? 'block' : 'none';
    }
    document.addEventListener('DOMContentLoaded', toggleDonorFields);
</script>
</body>
</html>
