<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Donor Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h2>My Donor Profile</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <p>
        Verification status:
        <span th:if="${verified}" class="badge bg-success">Verified</span>
        <span th:unless="${verified}" class="badge bg-warning text-dark">Pending Verification</span>
    </p>

    <form th:action="@{/donor/profile/toggle-availability}" method="post" class="mb-3">
        <button type="submit" class="btn"
                th:classappend="${available} ? 'btn-outline-danger' : 'btn-outline-success'">
            <span th:if="${available}">Mark as Unavailable</span>
            <span th:unless="${available}">Mark as Available</span>
        </button>
    </form>

    <form th:action="@{/donor/profile}" th:object="${profileUpdateRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:field="*{fullName}">
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Blood Group</label>
            <select class="form-select" th:field="*{bloodGroup}">
                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">District</label>
            <input type="text" class="form-control" th:field="*{district}">
            <div class="text-danger" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
</body>
</html>
