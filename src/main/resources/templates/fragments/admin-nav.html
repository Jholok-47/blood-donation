<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared admin navigation. Usage: <nav th:replace="~{fragments/admin-nav :: adminNav('overview')}"></nav>
     Needs the model attribute displayName. Page must load bootstrap.bundle.min.js for the mobile menu. -->
<nav th:fragment="adminNav(active)" class="navbar navbar-expand-lg navbar-dark admin-nav mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/overview}"><span class="brand-mark">&#10084;</span> LifeLink Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavMenu"
            aria-controls="adminNavMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNavMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'overview'} ? 'active'" th:href="@{/admin/overview}">Overview</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'issues'} ? 'active'" th:href="@{/admin/issues}">Issues</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'requests'} ? 'active'" th:href="@{/admin/requests}">Requests</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'verification'} ? 'active'" th:href="@{/admin/donors/unverified}">Verification</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'users'} ? 'active'" th:href="@{/admin/users}">Users</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'reports'} ? 'active'" th:href="@{/admin/reports}">Reports</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'audit'} ? 'active'" th:href="@{/admin/audit-log}">Audit log</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="nav-user" th:text="${displayName}">Admin</span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button type="submit" class="btn btn-sm btn-outline-light">Log out</button>
        </form>
      </div>
    </div>
  </div>
</nav>
</body>
</html>
