<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Blood Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 600px;">
    <h2 class="mb-4">Request Blood</h2>

    <form th:action="@{/patient/requests}" th:object="${bloodRequestCreateDto}" method="post">

        <div class="mb-3">
            <label class="form-label">Blood Group</label>
            <select class="form-select" th:field="*{bloodGroup}">
                <option value="">-- Select --</option>
                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity (units)</label>
            <input type="number" class="form-control" th:field="*{quantity}" min="1">
            <div class="text-danger small" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Urgency</label>
            <select class="form-select" th:field="*{urgency}">
                <option value="">-- Select --</option>
                <option th:each="u : ${urgencyLevels}" th:value="${u}" th:text="${u}"></option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('urgency')}" th:errors="*{urgency}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">District</label>
            <input type="text" class="form-control" th:field="*{district}">
            <div class="text-danger small" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description (optional)</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn btn-danger">Submit Request</button>
        <a th:href="@{/patient/requests}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
