<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rate Your Donor - LifeLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .star-rating { display: inline-flex; flex-direction: row-reverse; gap: .25rem; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 2.5rem; line-height: 1; color: #ced4da; cursor: pointer; transition: color .15s; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: #ffc107; }
    </style>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 560px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-1">Rate your donor</h4>
            <p class="text-muted mb-4">
                <span th:text="${donation.donorName}">Donor</span>
                &middot; <span th:text="${donation.bloodGroup}">O_POSITIVE</span>
                &middot; <span th:text="${#temporals.format(donation.donationDate, 'dd MMM yyyy')}">01 Jan 2026</span>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/patient/reviews}" th:object="${reviewForm}" method="post">
                <input type="hidden" th:field="*{donationHistoryId}">

                <div class="mb-3">
                    <label class="form-label d-block">Your rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" th:checked="*{rating == 5}">
                        <label for="star5" title="5 - Excellent">&#9733;</label>
                        <input type="radio" id="star4" name="rating" value="4" th:checked="*{rating == 4}">
                        <label for="star4" title="4 - Good">&#9733;</label>
                        <input type="radio" id="star3" name="rating" value="3" th:checked="*{rating == 3}">
                        <label for="star3" title="3 - Okay">&#9733;</label>
                        <input type="radio" id="star2" name="rating" value="2" th:checked="*{rating == 2}">
                        <label for="star2" title="2 - Poor">&#9733;</label>
                        <input type="radio" id="star1" name="rating" value="1" th:checked="*{rating == 1}">
                        <label for="star1" title="1 - Very poor">&#9733;</label>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>

                <div class="mb-3">
                    <label for="comment" class="form-label">Review <span class="text-muted">(optional)</span></label>
                    <textarea id="comment" class="form-control" rows="4" maxlength="1000"
                              placeholder="Was the donor punctual, cooperative, respectful?"
                              th:field="*{comment}"></textarea>
                    <div class="d-flex justify-content-between">
                        <div class="text-danger small" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                        <div class="text-muted small ms-auto"><span id="charCount">0</span>/1000</div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Submit review</button>
                    <a th:href="@{/patient/requests}" class="btn btn-outline-secondary">Maybe later</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        var ta = document.getElementById('comment');
        var out = document.getElementById('charCount');
        function update() { out.textContent = ta.value.length; }
        ta.addEventListener('input', update);
        update();
    })();
</script>
</body>
</html>
