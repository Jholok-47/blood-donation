<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Blood Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Blood Requests</h2>
        <a th:href="@{/patient/requests/new}" class="btn btn-danger">+ New Request</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <table class="table table-bordered" th:if="${!requests.isEmpty()}">
        <thead>
        <tr>
            <th>Blood Group</th>
            <th>Quantity</th>
            <th>Urgency</th>
            <th>District</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Review</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${requests}">
            <td th:text="${req.bloodGroup}"></td>
            <td th:text="${req.quantity}"></td>
            <td th:text="${req.urgency}"></td>
            <td th:text="${req.district}"></td>
            <td>
                <span class="badge"
                      th:classappend="${req.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${req.status.name() == 'APPROVED'} ? 'bg-success' : (${req.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-secondary'))"
                      th:text="${req.status}"></span>
            </td>
            <td th:text="${#temporals.format(req.createdAt, 'dd MMM yyyy HH:mm')}"></td>
            <td>
                <span th:with="p=${progressByRequestId.get(req.id)}" th:if="${p != null}"
                      th:text="${p.completed} + ' of ' + ${p.required} + ' unit(s) donated' + (${p.active} > 0 ? ', ' + ${p.active} + ' donor(s) on the way' : '')">0 of 1</span>
            </td>
            <td>
                <div th:each="s : ${reviewStates.get(req.id)}" class="mb-1">
                    <span th:text="${s.donorName}">Donor</span>
                    <span th:if="${s.reviewed}" class="text-warning">&#9733; <span th:text="${s.rating}">5</span></span>
                    <a th:if="${s.canReview}" th:href="@{/patient/reviews/new(donationId=${s.donationHistoryId})}" class="btn btn-sm btn-outline-danger">Rate</a>
                    <span th:if="${!s.reviewed and !s.canReview}" class="text-muted small">Review period ended</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${requests.isEmpty()}" class="text-muted">You haven't submitted any requests yet.</p>
</div>
<div th:replace="~{fragments/review-prompt :: reviewPrompt}"></div>
</body>
</html>
