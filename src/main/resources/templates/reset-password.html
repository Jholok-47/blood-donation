<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - LifeLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 80px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title mb-3">Enter your reset code</h4>
      <p class="text-muted small">
        We sent a 6-digit code to <strong th:text="${email}">your email</strong>. Enter it below
        along with your new password.
      </p>

      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

      <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
        <input type="hidden" th:field="*{email}">

        <div class="mb-3">
          <label class="form-label">Verification code</label>
          <input type="text" class="form-control" th:field="*{otpCode}" maxlength="6"
                 autocomplete="one-time-code" placeholder="123456" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control" th:field="*{newPassword}" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" class="form-control" th:field="*{confirmPassword}" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-danger w-100">Reset password</button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/forgot-password}">Didn't get a code? Request a new one</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
