<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Donor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Assign Donor</h2>
    <p>
        Blood group needed: <strong th:text="${bloodRequest.bloodGroup}"></strong> ·
        Quantity: <span th:text="${bloodRequest.quantity}"></span> ·
        Urgency: <span th:text="${bloodRequest.urgency}"></span> ·
        District: <span th:text="${bloodRequest.district}"></span> ·
        Status: <span th:text="${bloodRequest.status}"></span>
    </p>

    <div th:if="${#lists.isEmpty(rankedDonors)}" class="alert alert-warning">
        No verified, available, compatible donors found right now.
    </div>

    <form th:if="${!#lists.isEmpty(rankedDonors)}"
          th:action="${bloodRequest.status.name() == 'APPROVED'} ? @{/admin/requests/{id}/assign(id=${bloodRequest.id})} : @{/admin/requests/{id}/reassign(id=${bloodRequest.id})}"
          method="post">
        <table class="table table-striped">
            <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Blood Group</th>
                <th>District</th>
                <th>Score</th>
                <th title="Proximity / Reliability / Recency">Breakdown</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ranked, iterStat : ${rankedDonors}">
                <td>
                    <input type="radio" name="donorId" th:value="${ranked.donor.id}" th:checked="${iterStat.index == 0}" />
                </td>
                <td th:text="${ranked.donor.fullName}"></td>
                <td th:text="${ranked.donor.bloodGroup}"></td>
                <td th:text="${ranked.donor.district}"></td>
                <td>
                    <span class="badge bg-primary" th:text="${ranked.score.totalScore}"></span>
                </td>
                <td>
                    <small class="text-muted">
                        P: <span th:text="${ranked.score.proximityScore}"></span> ·
                        R: <span th:text="${ranked.score.reliabilityScore}"></span> ·
                        T: <span th:text="${ranked.score.recencyScore}"></span>
                    </small>
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary">
            <span th:text="${bloodRequest.status.name() == 'APPROVED'} ? 'Assign Selected Donor' : 'Reassign to Selected Donor'"></span>
        </button>
    </form>

    <a href="/admin/requests" class="btn btn-secondary mt-3">Back to Requests</a>
</div>
</body>
</html>
