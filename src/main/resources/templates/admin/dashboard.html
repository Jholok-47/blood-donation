<!DOCTYPE html>
<!-- Goal: admin landing page - "needs attention" counters + quick links. REPLACES the placeholder. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin dashboard - LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-1">Admin dashboard</h1>
    <p class="text-muted" th:text="'Signed in as ' + ${displayName}">Signed in</p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="display-6" th:text="${pendingRequestCount}">0</div>
                <div class="text-muted">Requests waiting for approval</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="display-6" th:text="${awaitingSelectionCount}">0</div>
                <div class="text-muted">Requests with donors ready to be assigned</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100" th:classappend="${unconfirmedAssignmentCount > 0} ? 'border-danger'"><div class="card-body">
                <div class="display-6" th:classappend="${unconfirmedAssignmentCount > 0} ? 'text-danger'" th:text="${unconfirmedAssignmentCount}">0</div>
                <div class="text-muted">Assigned donors not confirmed in time</div>
            </div></div>
        </div>
    </div>

    <div th:replace="~{fragments/quick-links :: adminQuickLinks}"></div>
</div>
</body>
</html>
