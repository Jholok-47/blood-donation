<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit log - LifeLink Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<nav th:replace="~{fragments/admin-nav :: adminNav('audit')}"></nav>

<div class="container pb-5">
  <div class="page-head mb-3">
    <h1>Audit log</h1>
    <div class="sub">Who changed what. Entries are append-only and cannot be edited here.</div>
  </div>

  <form class="panel panel-body mb-3 d-flex flex-wrap gap-2 align-items-end" method="get" th:action="@{/admin/audit-log}">
    <div>
      <label class="form-label small mb-1" for="action">Action</label>
      <select class="form-select form-select-sm" id="action" name="action">
        <option value="">All actions</option>
        <option th:each="a : ${actions}" th:value="${a}" th:text="${a.name().replace('_',' ').toLowerCase()}" th:selected="${a == action}"></option>
      </select>
    </div>
    <button class="btn btn-crimson btn-sm" type="submit">Filter</button>
  </form>

  <div class="panel">
    <div th:if="${entries.empty}" class="empty-state">No entries yet. Suspensions, reactivations and exports appear here.</div>
    <div class="table-responsive" th:unless="${entries.empty}">
      <table class="table table-admin">
        <thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
        <tbody>
        <tr th:each="e : ${entries.content}">
          <td class="muted text-nowrap" th:text="${#temporals.format(e.createdAt,'dd MMM yyyy HH:mm')}">-</td>
          <td th:text="${e.actorName}">Admin</td>
          <td><span class="tag" th:text="${e.action.name().replace('_',' ').toLowerCase()}">action</span></td>
          <td class="text-nowrap">
            <span th:if="${e.targetType != null}" th:text="${e.targetType} + (${e.targetId != null} ? ' #' + ${e.targetId} : '')">USER #1</span>
          </td>
          <td class="small" th:text="${e.details}">details</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav class="mt-3 d-flex justify-content-between align-items-center" th:if="${entries.totalPages > 1}">
    <span class="muted small">Page <span th:text="${entries.number + 1}">1</span> of <span th:text="${entries.totalPages}">1</span></span>
    <div class="btn-group btn-group-sm">
      <a class="btn btn-outline-secondary" th:classappend="${entries.first} ? 'disabled'"
         th:href="@{/admin/audit-log(action=${action},page=${entries.number - 1})}">Previous</a>
      <a class="btn btn-outline-secondary" th:classappend="${entries.last} ? 'disabled'"
         th:href="@{/admin/audit-log(action=${action},page=${entries.number + 1})}">Next</a>
    </div>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
