<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Review Blood Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4">Blood Requests</h2>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!--Filter form for status and urgency-->
    <form method="get" th:action="@{/admin/requests}" class="row g-3 mb-4">
        <div class="col-md-4">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Urgency</label>
            <select name="urgency" class="form-select">
                <option value="">All</option>
                <option th:each="u : ${urgencyLevels}" th:value="${u}" th:text="${u}"
                        th:selected="${u == selectedUrgency}"></option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a th:href="@{/admin/requests}" class="btn btn-outline-secondary ms-2">Clear</a>
        </div>
    </form>

    <!-- Table of requests with actions based on status -->
    <table class="table table-bordered" th:if="${!requests.isEmpty()}">
        <thead>
        <tr>
            <th>Patient</th>
            <th>Blood Group</th>
            <th>Units needed</th>
            <th>Urgency</th>
            <th>District</th>
            <th>Status</th>
            <th>Progress</th>
            <th>Interested</th>
            <th>Assigned donors</th>
            <th>Submitted</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${requests}">
            <td th:text="${req.patient.fullName}"></td>
            <td th:text="${req.bloodGroup}"></td>
            <td th:text="${req.quantity}"></td>
            <td th:text="${req.urgency}"></td>
            <td th:text="${req.district}"></td>
            <td th:text="${req.status}"></td>

            <!-- donated / assigned / needed -->
            <td th:with="p=${progressByRequestId.get(req.id)}">
            <span th:if="${p != null}"
                  th:text="${p.completed} + ' donated, ' + ${p.assigned} + ' assigned of ' + ${p.required}"></span>
            </td>

            <!-- donors who accepted the open call -->
            <td th:text="${interestedCounts.get(req.id) ?: 0}"></td>

            <!-- one line per assigned donor, with confirmation state -->
            <td>
                <div th:each="a : ${assignmentsByRequestId.get(req.id)}">
                    <span th:text="${a.donor.fullName}"></span>
                    <span th:if="${a.respondedAt == null and a.escalatedAt != null}" class="badge text-bg-danger">Not confirmed</span>
                    <span th:if="${a.respondedAt == null and a.escalatedAt == null}" class="badge text-bg-warning">Awaiting confirmation</span>
                    <span th:if="${a.respondedAt != null}" class="badge text-bg-success">Confirmed</span>
                </div>
            </td>

            <td th:text="${#temporals.format(req.createdAt, 'dd MMM yyyy HH:mm')}"></td>
            <td>
                <div th:if="${req.status.name() == 'PENDING'}">
                    <form th:action="@{/admin/requests/{id}/approve(id=${req.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-success">Approve</button>
                    </form>
                    <form th:action="@{/admin/requests/{id}/reject(id=${req.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                    </form>
                </div>
                <!-- one entry point: the page where the admin assigns donors, marks donations, releases, cancels -->
                <a th:if="${req.status.name() == 'APPROVED' or req.status.name() == 'ASSIGNED'}"
                   th:href="@{/admin/requests/{id}/assign(id=${req.id})}"
                   class="btn btn-sm btn-danger">Select donors</a>
                <a th:if="${req.status.name() == 'FULFILLED'}"
                   th:href="@{/admin/requests/{id}/assign(id=${req.id})}"
                   class="btn btn-sm btn-outline-secondary">View donors</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${requests.isEmpty()}" class="text-muted">No blood requests yet.</p>
</div>
</body>
</html>
