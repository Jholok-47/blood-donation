<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unverified Donors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Donors Pending Verification</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table table-bordered" th:if="${!donors.isEmpty()}">
        <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Blood Group</th><th>District</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="donor : ${donors}">
            <td th:text="${donor.fullName}"></td>
            <td th:text="${donor.email}"></td>
            <td th:text="${donor.bloodGroup}"></td>
            <td th:text="${donor.district}"></td>
            <td>
                <form th:action="@{/admin/donors/{id}/verify(id=${donor.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-success">Verify</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${donors.isEmpty()}">No donors awaiting verification.</p>
</div>
</body>
</html>
