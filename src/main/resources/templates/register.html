<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Blood Donation Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:500px;">
    <h2 class="mb-4">Create an Account</h2>

    <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:field="*{fullName}">
            <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{password}">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">I am a</label>
            <select class="form-select" th:field="*{role}">
                <option value="">-- Select --</option>
                <option value="PATIENT">Patient</option>
                <option value="DONOR">Donor</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Blood Group (donors only)</label>
            <select class="form-select" th:field="*{bloodGroup}">
                <option value="">-- Select --</option>
                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">District</label>
            <input type="text" class="form-control" th:field="*{district}">
        </div>
        <button type="submit" class="btn btn-danger w-100">Register</button>
    </form>
    <p class="mt-3">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
