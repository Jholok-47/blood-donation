<!DOCTYPE html>
<!-- Goal: donor landing page - open-call counter + quick links. REPLACES the placeholder. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor dashboard - LifeLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 mb-1">Donor dashboard</h1>
  <p class="text-muted" th:text="'Signed in as ' + ${displayName}">Signed in</p>

  <div class="alert alert-warning" th:if="${openRequestCount > 0}">
    <strong th:text="${openRequestCount}">1</strong> blood request(s) are waiting for your answer.
    <a th:href="@{/donor/requests}" class="alert-link">Respond now</a>
  </div>

  <div th:replace="~{fragments/quick-links :: donorQuickLinks(${openRequestCount}, ${unreadCount})}"></div>
</div>
</body>
</html>
