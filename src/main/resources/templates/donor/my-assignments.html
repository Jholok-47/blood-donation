<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Assignments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>My Assignments</h2>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table table-striped">
        <thead>
        <tr><th>Blood Group Needed</th><th>Quantity</th><th>Urgency</th><th>District</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${assignments}">
            <td th:text="${a.bloodRequest.bloodGroup}"></td>
            <td th:text="${a.bloodRequest.quantity}"></td>
            <td th:text="${a.bloodRequest.urgency}"></td>
            <td th:text="${a.bloodRequest.district}"></td>
            <td><span class="badge bg-secondary" th:text="${a.status}"></span></td>
            <td th:if="${a.status.name() == 'ACTIVE' and a.respondedAt == null}">
                <form th:action="@{/donor/assignments/{id}/accept(id=${a.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-success btn-sm">Accept</button>
                </form>
                <form th:action="@{/donor/assignments/{id}/decline(id=${a.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Decline</button>
                </form>
            </td>
            <td th:unless="${a.status.name() == 'ACTIVE' and a.respondedAt == null}">—</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
