<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>My Notifications</title></head>
<body>
<div class="container mt-4">
    <h2>My Notifications</h2>

    <table class="table" th:if="${not #lists.isEmpty(notifications)}">
        <thead>
        <tr><th>Message</th><th>Type</th><th>Received</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="n : ${notifications}" th:classappend="${!n.read} ? 'table-warning' : ''">
            <td th:text="${n.message}"></td>
            <td th:text="${n.type}"></td>
            <td th:text="${n.createdAt}"></td>
            <td>
                <div class="d-flex gap-1">
                    <a th:if="${n.type.name() == 'REQUEST_BROADCAST'}" th:href="@{/donor/requests}"
                       class="btn btn-sm btn-danger">Respond</a>
                    <a th:if="${n.type.name() == 'ASSIGNMENT'}" th:href="@{/donor/assignments}"
                       class="btn btn-sm btn-outline-danger">View assignment</a>
                    <form th:if="${!n.read}" th:action="@{/donor/notifications/{id}/read(id=${n.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Mark as read</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p>
</div>
</body>
</html>
