spring.application.name=blood-donation
server.port=8060

#Spring Datasource Configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lifelink
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jooq.sql-dialect=POSTGRES

#Lifelink Configuration (window-minutes=30, check-interval-ms=300000)
lifelink.cascade.window-minutes=1 
lifelink.cascade.check-interval-ms=10000

# Module 10 - Google Maps Integration
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
lifelink.maps.default-lat=23.8103
lifelink.maps.default-lng=90.4125
lifelink.maps.default-zoom=7

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Mail (Gmail SMTP + app password ? simplest free option per your open question)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP
lifelink.otp.expiry-minutes=10
lifelink.otp.length=6

# Review Prompt
lifelink.review.window-days=30

# Machine Learning
# Set lifelink.ml.enabled=false to force the pure rule-based ranking.
lifelink.ml.enabled=true
lifelink.ml.base-url=http://localhost:8001
lifelink.ml.weight=0.40
lifelink.ml.connect-timeout-ms=500
lifelink.ml.read-timeout-ms=2000

# ---- add to src/main/resources/application.properties ----
# Used in email links ("Open LifeLink" buttons). Change when you deploy.
lifelink.base-url=http://localhost:8060

# Text shown in the donor's eligibility statement (informational only - no date is stored or checked)
lifelink.donation.min-interval-months=4

# How long an assigned donor has to tap "Confirm I'm on my way" before the admin is alerted (minutes)
lifelink.assignment.ack-window.critical-minutes=1
lifelink.assignment.ack-window.high-minutes=1
lifelink.assignment.ack-window.medium-minutes=1
lifelink.assignment.ack-window.low-minutes=1

# How often the escalation check runs (ms)
lifelink.scheduler.escalation-interval-ms=10000

