spring.application.name=blood-donation
server.port=8060

#Spring Datasource Configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lifelink
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jooq.sql-dialect=POSTGRES

#Lifelink Configuration (window-minutes=30, check-interval-ms=300000)
lifelink.cascade.window-minutes=1 
lifelink.cascade.check-interval-ms=10000

# Module 10 - Google Maps Integration
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
lifelink.maps.default-lat=23.8103
lifelink.maps.default-lng=90.4125
lifelink.maps.default-zoom=7

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Mail (Gmail SMTP + app password ? simplest free option per your open question)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP
lifelink.otp.expiry-minutes=10
lifelink.otp.length=6